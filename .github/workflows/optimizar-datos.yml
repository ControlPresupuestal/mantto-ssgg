name: Optimizar datos para la web

on:
  push:
    branches: [main]
    paths:
      - "data/BD_ManttoSSGG.csv"
      - "data/BD_ManttoSSGG.csv.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprimir información
        run: python scripts/build_data.py

      - name: Guardar versión optimizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json.gz
          if git diff --cached --quiet; then
            echo "La versión optimizada ya está actualizada."
          else
            git commit -m "Optimizar datos del tablero"
            git push
          fi
